default_language_version:
  python: python3.14
fail_fast: false
minimum_pre_commit_version: 4.1.0
repos:
- hooks:
  - id: trailing-whitespace
  - id: end-of-file-fixer
  - id: check-yaml
    args:
    - --allow-multiple-documents
    exclude: ^\.github/ISSUE_TEMPLATE/
  - id: check-toml
  - id: debug-statements
  - id: check-merge-conflict
  - id: detect-private-key
  - id: check-json
  - args:
    - --branch
    - main
    id: no-commit-to-branch
  repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
- hooks:
  - args:
    - --fix
    id: ruff
  - id: ruff-format
  repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.15.12
- hooks:
  - id: makefile-check
  - id: python-print-detection
    exclude: (^|/)tests?/|^(README\.md|docs/)
  - id: python-pprint-detection
    exclude: (^|/)tests?/|^(README\.md|docs/)
  - id: python-unreachable-code
  - id: yaml-sorter
    exclude: ^(\.github/ISSUE_TEMPLATE/|\.github/workflows/|\.pre-commit-config\.yaml|GitVersion\.yml)
  - id: adr-gate
  - id: no-bare-except
  - id: python-logger-detection
    exclude: (^|/)tests?/|^(README\.md|docs/)
  - id: no-sync-in-async
  - id: debugger-detection
    exclude: (^|/)tests?/|^(README\.md|docs/)
  - id: regression-gate
    stages:
    - pre-push
  - id: json-sorter
  - id: env-file-check
  - id: env-example-sync
  - id: no-hardcoded-localhost
    exclude: tests?/|\.test\.|\.spec\.
  - id: claude-skill-frontmatter
  - id: claude-agent-frontmatter
  - id: claude-mcp-config
  - id: python-no-unittest-import
  - id: claude-assets-present
  - id: python-untyped-raise
    exclude: (^|/)tests?/
  - id: python-mutable-default
  - id: python-dispatch-ladder
  - id: dockerfile-no-latest
  repo: https://github.com/chrysa/pre-commit-tools
  rev: v0.2.0-247
- hooks:
  - args:
    - feat
    - fix
    - docs
    - style
    - refactor
    - test
    - chore
    - perf
    - revert
    - ci
    id: conventional-pre-commit
    stages:
    - commit-msg
  repo: https://github.com/compilerla/conventional-pre-commit
  rev: v4.4.0
- repo: https://github.com/igorshubovych/markdownlint-cli
  rev: v0.49.1
  hooks:
  - args:
    - --fix
    id: markdownlint
    stages:
    - manual
- repo: https://github.com/gitleaks/gitleaks
  rev: v8.30.1
  hooks:
  - id: gitleaks
- repo: https://github.com/chrysa/guideline-checker
  rev: v1.30.16
  hooks:
  - id: guideline-check
