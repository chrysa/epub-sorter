[build-system]
requires = ["setuptools>=83.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "epub-sorter"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "ebookmeta==1.2.11",
    "progress==1.6.1",
]

[project.optional-dependencies]
test = ["pytest>=9.1.1", "pytest-cov>=7.1.0", "pytest-mock>=3.15.1"]
build = ["pyinstaller==6.21.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short --cov-fail-under=85"

[tool.coverage.run]
source = ["common.py"]
omit = ["tests/*", "gui.py", "main.py", "cli.py", "build/*"]

[tool.coverage.report]
show_missing = true

[tool.ruff.lint]
select = [
    "C901",
    "PERF203",
    "PERF401",
    "PLR0402",
    "PLR0911",
    "PLR0912",
    "PLR0915",
    "PLR1714",
    "PLR1730",
    "PLR5501",
    "RUF005",
    "RUF006",
    "RUF007",
    "RUF009",
    "RUF012",
    "RUF013",
    "RUF022",
    "RUF043",
    "RUF059",
    "RUF100",
]
