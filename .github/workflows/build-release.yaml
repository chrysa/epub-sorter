on:
  push:
    branches:
    - main
    paths:
    - '**.py'
  workflow_dispatch: null
jobs:
  build-on-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: 'python -m pip install --upgrade pip

        pip install -r requirements.txt

        '
    - name: Build with pyinstaller
      run: 'pyinstaller --onefile --noconsole main.py --name "epub-sorter"

        '
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: e_opub_order_windows
        path: .\dist\e_opub_order.exe
    strategy:
      matrix:
        python-version:
        - 3.1
  create-release:
    needs:
    - build-on-windows
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
      with:
        path: ./
    - env:
        GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
      id: create_release
      name: Create github release
      uses: actions/create-release@0cb9c9b65d5d1901c1f53e5e66eaf4afd303e70e # v1
      with:
        draft: false
        prerelease: false
        release_name: Release Version ${{ github.run_number }}
        tag_name: v${{ github.run_number }}
    - env:
        GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
      name: Upload windows artifact to github release
      uses: actions/upload-release-asset@e8f9f06c4b078e705bd2ea027f0926603fc9b4d5 # v1
      with:
        asset_content_type: application
        asset_name: e_opub_order_windows.exe
        asset_path: ./epub-sorter*epub-sorter.exe
        upload_url: ${{ steps.create_release.outputs.upload_url }}
